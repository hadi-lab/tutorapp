{% extends "base.html" %}
{%block title%} Student Signup {% endblock %}
{% block content %}
    <input type="email"  id="email" placeholder="email">
    <input type="password"  id="password" placeholder="password">
    <button onclick="set_student()" >Sign up</button>
    <p>already have an account? <a href="/student_login_page">log in</a></p>
    <div id="result" ></div>
{% endblock %}
{% block scripts %}
    <script>
        async function set_student(){
            let response;
            try{
                response=await fetch("/student_signup",{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({
                    email:document.getElementById("email").value,
                    password:document.getElementById("password").value
                })
            })
            }
            
            catch(e){
                document.getElementById("result").innerHTML="Connection problem,please try again."
                return;
            }
                
            const data= await response.json()
            
            if( response.status===200  ||data.redirect){
                window.location.href=data.redirect
            }
            else{
                document.getElementById("result").innerHTML= data["error"]
            }
            
            
        }
    </script>
{% endblock %}
