{% extends "base.html" %}
{%block title%} Student login {% endblock %}
{% block content %}
    <input type="email"  id="email" placeholder="email">
    <input type="password"  id="password" placeholder="password">
    <button onclick="log_in()" >log in</button>
    <p>dont have an account?<a href="/student_signup_page">Sign up here</a></p> 
    <div id="result" ></div>
{% endblock %}
{% block scripts %}
    <script>
        async function log_in() {
            let response;
            try{
                const response=await fetch("/student_login",{

                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({
                    email:document.getElementById("email").value,
                    password:document.getElementById("password").value
                })
            })
            }
            catch(e){
                document.getElementById("result").innerHTML="Connection problem,please try again"
                return;
            }
            const data=await response.json()
            if( response.status===200 ||data.redirect){
                window.location.href=data.redirect
            }
            else{
                document.getElementById("result").innerHTML= data["error"]
            }
        }
    </script>
{% endblock %}
